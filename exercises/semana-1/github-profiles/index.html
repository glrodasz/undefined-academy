<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Profiles — Semana 1</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 0.25rem;
    }

    .subtitle {
      font-size: 0.875rem;
      color: #8b949e;
      margin-bottom: 1.5rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.625rem;
      align-items: center;
      margin-bottom: 1rem;
    }

    #search {
      flex: 1;
      min-width: 180px;
      padding: 0.5rem 0.75rem;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 0.875rem;
      outline: none;
    }
    #search:focus { border-color: #58a6ff; }
    #search::placeholder { color: #484f58; }

    button {
      padding: 0.5rem 0.875rem;
      border-radius: 6px;
      border: 1px solid #30363d;
      font-size: 0.8125rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-secondary {
      background: #21262d;
      color: #c9d1d9;
    }
    .btn-secondary:hover { background: #30363d; border-color: #8b949e; }

    .btn-primary {
      background: #238636;
      color: #fff;
      border-color: #2ea043;
      font-weight: 600;
    }
    .btn-primary:hover { background: #2ea043; }
    .btn-primary:disabled {
      background: #21262d;
      color: #484f58;
      border-color: #30363d;
      cursor: not-allowed;
    }

    .count {
      font-size: 0.8125rem;
      color: #8b949e;
      margin-left: auto;
    }

    .popup-note {
      font-size: 0.75rem;
      color: #8b949e;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 0.5rem 0.75rem;
      margin-bottom: 1rem;
    }
    .popup-note strong { color: #e3b341; }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    li {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.1s, border-color 0.1s;
    }
    li:hover { background: #161b22; border-color: #30363d; }

    li input[type="checkbox"] {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      accent-color: #2ea043;
      cursor: pointer;
    }

    li a {
      color: #58a6ff;
      text-decoration: none;
      font-size: 0.875rem;
      flex: 1;
    }
    li a:hover { text-decoration: underline; }

    .hidden { display: none !important; }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #484f58;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>

<h1>GitHub Profiles</h1>
<p class="subtitle">Semana 1 — student submissions</p>

<div class="toolbar">
  <input id="search" type="search" placeholder="Filter profiles…" autocomplete="off" />
  <button class="btn-secondary" onclick="selectAll()">Select all</button>
  <button class="btn-secondary" onclick="deselectAll()">Deselect all</button>
  <button id="openBtn" class="btn-primary" onclick="openTabs()" disabled>Open selected in tabs</button>
  <span id="count" class="count"></span>
</div>

<p class="popup-note">
  <strong>Tip:</strong> If your browser blocks the tabs, click the popup-blocked icon in the address bar and allow popups for this page, then try again.
</p>

<ul id="list"></ul>
<p id="emptyState" class="empty-state hidden">No profiles match your search.</p>

  const listEl = document.getElementById("list");
  const searchEl = document.getElementById("search");
  const countEl = document.getElementById("count");
  const openBtn = document.getElementById("openBtn");
  const emptyState = document.getElementById("emptyState");

  function buildList() {
    listEl.innerHTML = "";
    const q = searchEl.value.trim().toLowerCase();
    const visible = q ? folders.filter(f => f.toLowerCase().includes(q)) : folders;

    visible.forEach(name => {
      const li = document.createElement("li");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.dataset.folder = name;
      cb.addEventListener("change", updateButton);

      const a = document.createElement("a");
      a.href = `./${encodeURIComponent(name)}/index.html`;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = name;

      li.appendChild(cb);
      li.appendChild(a);
      listEl.appendChild(li);
    });

    emptyState.classList.toggle("hidden", visible.length > 0);
    updateCount(visible.length);
    updateButton();
  }

  function updateCount(visibleCount) {
    const total = folders.length;
    countEl.textContent = visibleCount === total
      ? `${total} profiles`
      : `${visibleCount} of ${total} profiles`;
  }

  function updateButton() {
    const checked = listEl.querySelectorAll("input[type=checkbox]:checked").length;
    openBtn.disabled = checked === 0;
    openBtn.textContent = checked > 0
      ? `Open ${checked} selected in tabs`
      : "Open selected in tabs";
  }

  function selectAll() {
    listEl.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = true);
    updateButton();
  }

  function deselectAll() {
    listEl.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
    updateButton();
  }

  function openTabs() {
    listEl.querySelectorAll("input[type=checkbox]:checked").forEach(cb => {
      window.open(`./${encodeURIComponent(cb.dataset.folder)}/index.html`, "_blank");
    });
  }

  searchEl.addEventListener("input", buildList);

  buildList();
</script>

</html>
